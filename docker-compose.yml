services:
  game-hextris:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-hextris
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
